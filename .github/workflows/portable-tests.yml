name: Portable tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    name: Python 3.12 on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install portable test dependencies
        run: python -m pip install -e ".[test]"
      - name: Compile project sources
        run: python -m compileall -q src tests scripts run_pipeline.py
      - name: Run offline tests with synthetic images
        run: python -m pytest -q --tb=short
