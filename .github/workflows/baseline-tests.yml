name: Real pretrained baseline
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  baseline:
    name: Real DINOv2 / ${{ matrix.os }} / CPU
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install CPU PyTorch on Linux
        if: runner.os == 'Linux'
        run: python -m pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Install Mac through the user-facing wrapper
        if: runner.os == 'macOS'
        run: bash oct.sh setup
      - name: Install baseline on Windows/Linux
        if: runner.os != 'macOS'
        run: python -m pip install -r requirements.txt
      - name: Mac real model self-test
        if: runner.os == 'macOS'
        run: bash oct.sh test
      - name: Windows/Linux real model self-test
        if: runner.os != 'macOS'
        run: python oct.py test
      - name: Mac actual extraction/export/cache tests
        if: runner.os == 'macOS'
        env:
          OCT_TEST_BASELINE: '1'
        run: .venv-dense/bin/python -m pytest -q
      - name: Windows/Linux actual extraction/export/cache tests
        if: runner.os != 'macOS'
        env:
          OCT_TEST_BASELINE: '1'
        run: python -m pytest -q
      - name: Mac real attention and normalization inspection
        if: runner.os == 'macOS'
        run: bash oct.sh inspect --offline --output-dir outputs/ci-inspection
      - name: Windows/Linux real attention and normalization inspection
        if: runner.os != 'macOS'
        run: python oct.py inspect --offline --output-dir outputs/ci-inspection
      - name: Upload self-test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baseline-evidence-${{ matrix.os }}
          path: |
            outputs/self-test/self_test.json
            outputs/last-error.log
            outputs/ci-inspection/report.json
            outputs/research-error.log
